name: Release

# Builds the addon zip and publishes it as a GitHub Release (what WowUp downloads).
# Runs when the "## Version:" line in DotPredictor.toc changes on main, and releases that version
# as v<version> if it hasn't been released yet. "Run workflow" on the Actions tab does the same.
on:
  push:
    branches: [main]
    paths: ["DotPredictor.toc", ".github/workflows/release.yml"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: ver
        run: |
          v=$(sed -n 's/^## Version: *//p' DotPredictor.toc | tr -d '\r' | head -1)
          if [ -z "$v" ]; then echo "No version in DotPredictor.toc"; exit 1; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build the zip
        if: steps.ver.outputs.skip != 'true'
        run: |
          mkdir -p build/DotPredictor
          rsync -a --exclude '.git*' --exclude '.github' --exclude '.pkgmeta' --exclude 'build' ./ build/DotPredictor/
          cd build && zip -qr "DotPredictor-v${{ steps.ver.outputs.v }}.zip" DotPredictor

      - name: Publish the release
        if: steps.ver.outputs.skip != 'true'
        run: |
          v=${{ steps.ver.outputs.v }}
          notes=$(awk -v v="$v" '$0 ~ "^#+ "v"( |$)" {f=1; next} f && /^#+ [0-9]/ {exit} f' CHANGELOG.md 2>/dev/null)
          [ -n "$notes" ] || notes="Version $v"
          gh release create "v$v" "build/DotPredictor-v$v.zip" --title "v$v" --notes "$notes" --target "$GITHUB_SHA"
